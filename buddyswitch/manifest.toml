[[buddies]]
id = "market"
label = "Market"
scope = "Research demand, users, and competition."
skills = [
  "research-scan",
  "pmf-recon",
  "customer-discovery",
  "positioning-copy",
  "channel-discovery",
  "launch-prep",
]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "pm"
label = "PM"
scope = "Own product iteration and track progression."
skills = ["write-prd", "track-manager"]
permissions = [
  "track.read",
  "track.create",
  "track.update",
  "track.advance",
  "task.read",
  "task.create",
  "task.update",
  "task.archive",
  "artifact.read",
  "artifact.create",
  "artifact.update",
  "artifact.delete",
]

[[buddies]]
id = "design"
label = "Design"
scope = "Shape UI/UX prototype direction and design handoff outcomes."
skills = ["shape-prototype"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "dev"
label = "Dev"
scope = "Implement approved scope in project code."
skills = ["implement-task"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "test"
label = "Test"
scope = "Validate behavior and report pass/fail/blocked outcomes."
skills = ["smoke-test"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]
