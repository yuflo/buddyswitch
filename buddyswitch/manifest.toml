schema_version = 1

[env]
id = "buddyswitch"
label = "BuddySwitch Env"

[[adapters]]
id = "codex"
path = "scripts/codex_router.py"
description = "Resolve supported `switch <buddy>...: <demand>` directives with env-backed buddy scope, skills, and object permissions."

[[skills]]
id = "research-scan"
path = "buddyswitch/skills/market/research-scan/SKILL.md"
description = "Browser-first market research scan workflow."
buddies = ["market"]
objects = ["task", "artifact"]

[[skills]]
id = "write-prd"
path = "buddyswitch/skills/pm/write-prd/SKILL.md"
description = "PM PRD authoring and scope shaping workflow."
buddies = ["pm"]
objects = ["task", "artifact"]

[[skills]]
id = "track-manager"
path = "buddyswitch/skills/pm/track-manager/SKILL.md"
description = "PM track lifecycle manager workflow."
buddies = ["pm"]
objects = ["track", "task"]

[[skills]]
id = "ia-spec"
path = "buddyswitch/skills/design/ia-spec/SKILL.md"
description = "Information architecture and interaction specification workflow."
buddies = ["design"]
objects = ["task", "artifact"]

[[skills]]
id = "implement-task"
path = "buddyswitch/skills/dev/implement-task/SKILL.md"
description = "Scoped implementation workflow for project code."
buddies = ["dev"]
objects = ["task", "artifact"]

[[skills]]
id = "smoke-test"
path = "buddyswitch/skills/test/smoke-test/SKILL.md"
description = "Smoke validation workflow with structured outcomes."
buddies = ["test"]
objects = ["task", "artifact"]

[[buddies]]
id = "market"
label = "Market"
scope = "Research demand, users, and competition."
skills = ["research-scan"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "pm"
label = "PM"
scope = "Own product iteration and track progression."
skills = ["write-prd", "track-manager"]
permissions = [
  "track.read",
  "track.create",
  "track.update",
  "track.advance",
  "task.read",
  "task.create",
  "task.update",
  "task.archive",
  "artifact.read",
  "artifact.create",
  "artifact.update",
  "artifact.delete",
]

[[buddies]]
id = "design"
label = "Design"
scope = "Define IA and UX flow specifications."
skills = ["ia-spec"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "dev"
label = "Dev"
scope = "Implement approved scope in project code."
skills = ["implement-task"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]

[[buddies]]
id = "test"
label = "Test"
scope = "Validate behavior and report pass/fail/blocked outcomes."
skills = ["smoke-test"]
permissions = ["track.read", "task.read", "task.create", "task.update", "task.archive", "artifact.read", "artifact.create", "artifact.update"]
