[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddyswitch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["buddyswitch*"]
exclude = [
  "buddyswitch.tests*",
  "buddyswitch.*.tests*",
]
namespaces = false

[tool.setuptools.package-data]
"buddyswitch.catalog" = ["**/*.toml", "**/*.json", "**/*.md"]
"buddyswitch.config" = ["**/*.toml", "**/*.json", "**/*.md"]
"buddyswitch.contracts" = ["**/*.toml", "**/*.json", "**/*.md"]
"buddyswitch.foundation.app_server" = ["shell/*.sh"]
"buddyswitch.foundation.browser_runtime" = ["assets/**/*.json"]
"buddyswitch.foundation.cli_runtime" = ["shell/*.sh"]
"buddyswitch.foundation.host_control" = ["shell/*.sh"]
"buddyswitch.foundation.web_runtime" = [
  "assets/**/*.md",
  "assets/**/*.html",
  "assets/**/*.css",
  "assets/**/*.js",
  "assets/**/LICENSE*",
]
"buddyswitch.launcher" = [
  "assets/**/*.md",
]
"buddyswitch.modules.demand" = ["skills/**/*.md"]
"buddyswitch.modules.track" = ["skills/**/*.md"]
"buddyswitch.modules.artifact" = [
  "assets/**/*.json",
  "skills/**/*.md",
]
"buddyswitch.skills" = ["**/*.toml", "**/*.json", "**/*.md", "**/*.sh"]
